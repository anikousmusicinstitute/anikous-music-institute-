<!DOCTYPE html>
<html>

<head>

<title>Piano Live Class</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

</head>


<body>


<h1>🎹 Piano Live Class</h1>


<button onclick="joinVideo()">
🎥 Join Video Call
</button>


<div id="jitsi-container"></div>


<br>


<button onclick="connectMIDI()">
🎹 Connect MIDI Keyboard
</button>


<br><br>


<label>
Select Octave:
</label>


<select id="octave" onchange="createPiano()">

<option value="1">Octave 1</option>
<option value="2">Octave 2</option>
<option value="3" selected>Octave 3</option>
<option value="4">Octave 4</option>
<option value="5">Octave 5</option>
<option value="6">Octave 6</option>
<option value="7">Octave 7</option>

</select>



<h2>🎹 Piano Keyboard</h2>


<div id="piano"></div>


<div id="note">
Waiting...
</div>



<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script src="https://meet.jit.si/external_api.js"></script>

<script src="script.js"></script>


</body>

</html>

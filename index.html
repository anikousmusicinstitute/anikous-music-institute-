<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>🎹 Piano Live Pro</title>

<link rel="stylesheet" href="style.css">

</head>

<body oncontextmenu="return false;">


<!-- HEADER -->

<header class="top">

<h1>🎹 Piano Live Pro</h1>

<button id="videoBtn" onclick="startVideo()">
🎥 Video Call
</button>

</header>


<!-- OPTIONS -->

<section class="options">

<button id="keysBtn"
class="active"
onclick="toggleKeys()">

🎹 Keys ON

</button>

<button id="chordsBtn"
class="active"
onclick="toggleChords()">

🎵 Chords ON

</button>

<button id="holdBtn"
onclick="toggleHold()">

✋ HOLD OFF

</button>

</section>


<!-- VIDEO -->

<div id="videoBox">

<iframe
id="meet"
allow="camera; microphone"
allowfullscreen>
</iframe>

</div>


<!-- DISPLAY -->

<section class="info">

<div class="card">

<h3>Keys</h3>

<span id="keyShow">-</span>

</div>

<div class="card">

<h3>Chord</h3>

<span id="chordShow">-</span>

</div>

</section>


<!-- PIANO -->

<section class="pianoArea">

<div id="piano"></div>

</section>


<script src="sound.js"></script>

<script src="chords.js"></script>

<script src="piano.js"></script>

<script src="app.js"></script>

</body>

</html>

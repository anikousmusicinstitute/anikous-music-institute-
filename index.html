<!DOCTYPE html>
<html>
<head>
    <title>Piano Live Class</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🎹 Piano Live Class</h1>

<button onclick="joinVideo()">🎥 Join Video Call</button>
<div id="video">
    <iframe
    src="https://meet.jit.si/PianoLiveClassRoom"
    width="100%"
    height="600"
    allow="camera; microphone; fullscreen"
    style="border:0;">
    </iframe>
</div>
<button onclick="connectMIDI()">🎹 Connect MIDI Keyboard</button>

<div id="piano">
    <div class="key">C</div>
    <div class="key">D</div>
    <div class="key">E</div>
    <div class="key">F</div>
    <div class="key">G</div>
    <div class="key">A</div>
    <div class="key">B</div>
</div>

<script src="script.js"></script>
    <div id="jitsi-container"></div>

<script src="https://meet.jit.si/external_api.js"></script>

</body>
</html>

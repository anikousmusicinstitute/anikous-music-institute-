<!DOCTYPE html>
<html>

<head>

<title>Premium 88 Keys Piano</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

</head>


<body>


<h1>🎹 Premium Piano Studio</h1>



<div class="controls">


<button onclick="toggleKeys()">
🎼 Keys Name ON/OFF
</button>


<button onclick="toggleChords()">
🎵 Chords Name ON/OFF
</button>


<button onclick="zoomOut()">
➖
</button>


<button onclick="zoomIn()">
➕
</button>


</div>




<div id="piano-wrapper">


<div id="piano"></div>


</div>



<h2 id="chordDisplay">
Chord: None
</h2>



<div id="note">
Ready 🎹
</div>




<script src="script.js"></script>


</body>

</html>

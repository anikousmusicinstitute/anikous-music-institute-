<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anikous Music Institute</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Anikous Music Institute</h1>

    <div class="video-container">

        <video
            id="localVideo"
            autoplay
            playsinline
            muted>
        </video>

        <video
            id="remoteVideo"
            autoplay
            playsinline>
        </video>

    </div>

    <div class="controls">

        <input
            type="text"
            id="roomId"
            placeholder="Enter Class ID">

        <button id="joinBtn">
            Join Class
        </button>

        <button id="micBtn">
            🎤 Mic
        </button>

        <button id="cameraBtn">
            📷 Camera
        </button>

        <button id="leaveBtn">
            ❌ Leave
        </button>

    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="App.js"></script>

</body>
</html>

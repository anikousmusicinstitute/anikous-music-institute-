<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Anikous Music Institute</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
:root {
  --key-width: 32px;
  --key-height: 200px;
  --black-width: 20px;
  --black-height: 125px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

body{
  background:#080b12;
  color:white;
  font-family:Arial,sans-serif;
  overflow-x:hidden;
}

button{
  border:0;
  border-radius:10px;
  padding:10px 14px;
  background:#202938;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.96);
}

button.active{
  background:#16a34a;
}

.top{
  padding:16px;
  text-align:center;
  background:#111827;
  border-bottom:1px solid #293244;
}

.top h1{
  font-size:23px;
  color:#ffffff;
}

.sub{
  margin-top:5px;
  color:#9ca3af;
  font-size:12px;
}

.panel{
  width:min(1100px,96%);
  margin:12px auto;
  background:#111827;
  border-radius:16px;
  padding:14px;
}

.roomRow{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.roomRow input,
.roomRow select{
  flex:1;
  min-width:120px;
  background:#05070b;
  color:white;
  border:1px solid #374151;
  border-radius:10px;
  padding:11px;
}

.status{
  margin-top:10px;
  padding:10px;
  border-radius:9px;
  background:#05070b;
  color:#a7f3d0;
  text-align:center;
  font-size:13px;
  min-height:38px;
}

/* VIDEO */

.videoGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.videoCard{
  position:relative;
  background:#020617;
  border-radius:14px;
  overflow:hidden;
  min-height:220px;
  border:1px solid #263044;
}

.videoCard video{
  width:100%;
  height:100%;
  min-height:220px;
  object-fit:cover;
  background:#000;
}

.videoName{
  position:absolute;
  left:8px;
  bottom:8px;
  background:rgba(0,0,0,.65);
  padding:6px 9px;
  border-radius:7px;
  font-size:12px;
}

.controls{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:10px;
}

/* INFO */

.info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.infoCard{
  background:#05070b;
  border:1px solid #263044;
  padding:12px;
  border-radius:12px;
  text-align:center;
}

.infoCard small{
  display:block;
  color:#9ca3af;
  margin-bottom:5px;
}

.infoCard strong{
  font-size:20px;
}

/* PIANO */

.pianoHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:10px;
  flex-wrap:wrap;
}

.octaves{
  display:flex;
  gap:5px;
  overflow-x:auto;
  padding-bottom:5px;
}

.octaves button{
  min-width:43px;
  padding:7px;
}

.pianoScroll{
  width:100%;
  overflow-x:auto;
  overflow-y:hidden;
  background:#020617;
  border-radius:12px;
  padding:12px;
  -webkit-overflow-scrolling:touch;
}

#piano{
  position:relative;
  height: calc(var(--key-height) + 15px);
  width: 100%;
}

.white{
  position:absolute;
  top:0;
  width: var(--key-width);
  height: var(--key-height);
  background:linear-gradient(to bottom,#fff,#d1d5db);
  border:1px solid #777;
  border-radius:0 0 7px 7px;
  z-index:1;
  color:#111;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding-bottom:8px;
  font-size:9px;
  user-select:none;
  touch-action:none;
}

.white.local-active{
  background:#facc15 !important;
  box-shadow:0 0 12px rgba(250,204,21,.9);
  transform:translateY(3px);
}

.white.remote-active{
  background:#38bdf8 !important;
  box-shadow:0 0 14px rgba(56,189,248,.95);
  transform:translateY(3px);
}

.white.local-active.remote-active{
  background:#c084fc !important;
  box-shadow:0 0 18px rgba(192,132,252,1);
  transform:translateY(3px);
}

.black{
  position:absolute;
  top:0;
  width: var(--black-width);
  height: var(--black-height);
  background:linear-gradient(#333,#000);
  border:1px solid #111;
  border-radius:0 0 6px 6px;
  z-index:2;
  color:white;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding-bottom:6px;
  font-size:7px;
  user-select:none;
  touch-action:none;
}

.black.local-active{
  background:#facc15 !important;
  color:#111 !important;
  box-shadow:0 0 12px rgba(250,204,21,.95);
  transform:translateY(3px);
}

.black.remote-active{
  background:#38bdf8 !important;
  color:#fff !important;
  box-shadow:0 0 14px rgba(56,189,248,1);
  transform:translateY(3px);
}

.black.local-active.remote-active{
  background:#c084fc !important;
  color:#111 !important;
  box-shadow:0 0 18px rgba(192,132,252,1);
  transform:translateY(3px);
}

.noteToggle{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:10px;
}

/* APP STYLE KEYBOARD FULLSCREEN MODE (ORG 24 / Perfect Piano Look) */
#pianoFullscreenContainer {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: #0f172a;
  z-index: 99999;
  flex-direction: column;
  box-sizing: border-box;
  overflow: hidden;
}

#pianoFullscreenContainer.active {
  display: flex;
}

/* App Top Toolbar */
.fsToolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #1e293b;
  padding: 8px 14px;
  border-bottom: 2px solid #334155;
  height: 52px;
}

.fsToolbarLeft, .fsToolbarRight {
  display: flex;
  align-items: center;
  gap: 10px;
}

.fsIconBtn {
  background: #334155;
  color: white;
  border: none;
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 14px;
  cursor: pointer;
}

.fsIconBtn:active {
  background: #475569;
}

.fsMiniScrollPreview {
  flex: 1;
  max-width: 350px;
  height: 28px;
  background: #020617;
  border-radius: 4px;
  border: 1px solid #475569;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.fsMiniScrollPreview span {
  font-size: 11px;
  color: #94a3b8;
}

/* Main Piano Area inside Fullscreen */
.fsPianoBody {
  flex: 1;
  width: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  background: #020617;
  padding: 8px;
  -webkit-overflow-scrolling: touch;
  display: flex;
  align-items: stretch;
}

#fsPiano {
  position: relative;
  height: 100%;
  min-height: 240px;
}

/* MOBILE */

@media(max-width:650px){
  .videoGrid{
    grid-template-columns:1fr;
  }

  .videoCard,
  .videoCard video{
    min-height:190px;
  }

  .info{
    grid-template-columns:1fr;
  }

  .top h1{
    font-size:19px;
  }

  button{
    padding:9px 10px;
    font-size:12px;
  }
}
</style>
</head>

<body>

<header class="top">
  <h1>AMI ONLINE MUSIC CLASS</h1>
  <div class="sub">Teacher - Student - Live Piano - MIDI</div>
</header>

<!-- ROOM -->
<section class="panel">
  <div class="roomRow">
    <input id="roomId" placeholder="Enter Room ID">
    <select id="userRole">
      <option value="teacher">Teacher</option>
      <option value="student">Student</option>
    </select>
    <button onclick="startClass()">Start Class</button>
  </div>
  <div id="status" class="status">
    Ready - Enter Room ID and Start Class
  </div>
</section>

<!-- VIDEO -->
<section class="panel">
  <div class="videoGrid">
    <div class="videoCard">
      <video id="localVideo" autoplay playsinline muted></video>
      <div class="videoName" id="localName">Teacher - My Camera</div>
    </div>
    <div class="videoCard">
      <video id="remoteVideo" autoplay playsinline></video>
      <div class="videoName" id="remoteName">Student - Remote Camera</div>
    </div>
  </div>
  <div class="controls">
    <button id="cameraBtn" onclick="toggleCamera()">Camera ON</button>
    <button onclick="switchCamera()">Front / Back</button>
    <button id="micBtn" onclick="toggleMic()">Mic ON</button>
    <button onclick="openJitsiMeet()" style="background:#2563eb;">Jitsi Meet (Backup)</button>
  </div>
</section>

<!-- INFORMATION -->
<section class="panel">
  <div class="info">
    <div class="infoCard">
      <small>Keys</small>
      <strong id="keyShow">-</strong>
    </div>
    <div class="infoCard">
      <small>Chord</small>
      <strong id="chordShow">-</strong>
    </div>
  </div>
</section>

<!-- PIANO -->
<section class="panel">
  <div class="pianoHeader">
    <h3>7 Octave Piano</h3>
    <div class="controls">
      <button onclick="zoomIn()">Zoom +</button>
      <button onclick="zoomOut()">Zoom -</button>
      <button id="holdBtn" onclick="toggleHold()">HOLD OFF</button>
      <button onclick="togglePianoFullscreen()" style="background:#16a34a;">Full View</button>
      <button onclick="connectMIDI()">MIDI CONNECT</button>
    </div>
  </div>
  <div class="octaves" id="octaveButtons"></div>
  <div class="pianoScroll" id="pianoScroll">
    <div id="piano"></div>
  </div>
  <div class="noteToggle">
    <button id="keyToggle" class="active" onclick="toggleKeyNames()">Key Names ON</button>
    <button onclick="centerPiano()">Center Piano</button>
  </div>
</section>

<!-- PROFESSIONAL APP STYLE FULLSCREEN KEYBOARD POPUP -->
<div id="pianoFullscreenContainer">
  <!-- App Top Toolbar like ORG/Perfect Piano -->
  <div class="fsToolbar">
    <div class="fsToolbarLeft">
      <button class="fsIconBtn" onclick="togglePianoFullscreen()" title="Exit">⬅️</button>
      <button class="fsIconBtn" onclick="toggleHold()" id="fsHoldBtn">HOLD</button>
    </div>
    
    <div class="fsMiniScrollPreview">
      <span id="fsChordDisplay">Anikous Piano Full View</span>
    </div>

    <div class="fsToolbarRight">
      <button class="fsIconBtn" onclick="toggleKeyNames()">Notes</button>
      <button class="fsIconBtn" onclick="togglePianoFullscreen()" style="background:#dc2626;">✕ Exit</button>
    </div>
  </div>

  <!-- Keyboard Piano Area -->
  <div class="fsPianoBody" id="fsPianoScroll">
    <div id="fsPiano"></div>
  </div>
</div>

<script>
let peer = null;
let localStream = null;
let currentFacing = "user";
let cameraOn = true;
let micOn = true;
let currentRole = "";
let currentRoom = "";
let mediaCall = null;
let dataConnection = null;

const localVideo = document.getElementById("localVideo");
const remoteVideo = document.getElementById("remoteVideo");
const statusBox = document.getElementById("status");

function status(text){
  statusBox.textContent = text;
}

async function getCameraStream(){
  if(localStream){
    localStream.getTracks().forEach(t=>t.stop());
  }

  try{
    localStream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ ideal: currentFacing },
        width:{ ideal: 1280 },
        height:{ ideal: 720 }
      },
      audio:true
    });

    localVideo.srcObject = localStream;
    cameraOn = true;
    micOn = true;
    updateMediaButtons();
    status("Camera and Microphone Connected");
    return localStream;
  }catch(error){
    console.error(error);
    status("Camera or Microphone Permission Not Granted");
    alert("Camera open ஆகவில்லை.\n\n1. HTTPS page-ல் open செய்யுங்கள்\n2. Camera permission Allow செய்யுங்கள்\n3. Microphone permission Allow செய்யுங்கள்");
    throw error;
  }
}

async function startClass(){
  const room = document.getElementById("roomId").value.trim();
  const role = document.getElementById("userRole").value;

  if(!room){
    alert("Room ID enter செய்யுங்கள்.");
    return;
  }

  if(!window.isSecureContext){
    status("HTTPS Required For Camera");
    alert("Camera வேலை செய்ய HTTPS தேவை.");
    return;
  }

  currentRole = role;
  currentRoom = room;
  updateRoleNames();

  try{
    await getCameraStream();
  }catch(e){
    return;
  }

  const peerId = "anikous-" + room + "-" + role;
  status("Connecting To Class");

  peer = new Peer(peerId, {
    host:"0.peerjs.com",
    port:443,
    path:"/",
    secure:true
  });

  peer.on("open", id => {
    status("Connected - " + (role==="teacher" ? "Teacher" : "Student") + " - Room - " + room);
    if(role==="student"){
      const teacherId = "anikous-" + room + "-teacher";
      callPeer(teacherId);
      connectData(teacherId);
    }
  });

  peer.on("call", call => {
    mediaCall = call;
    call.answer(localStream);
    call.on("stream", remoteStream => {
      remoteVideo.srcObject = remoteStream;
      status("Live Teacher And Student Video Connected");
    });
    call.on("close", () => {
      remoteVideo.srcObject = null;
      status("Remote User Disconnected");
    });
  });

  peer.on("connection", connection => {
    dataConnection = connection;
    setupDataConnection(connection);
  });

  peer.on("error", err => {
    console.error(err);
    if(err.type==="peer-unavailable"){
      status("Other User Has Not Joined Yet");
    }else{
      status("Connection Error - " + err.type);
    }
  });
}

function callPeer(id){
  if(!peer || !localStream) return;
  mediaCall = peer.call(id, localStream);
  mediaCall.on("stream", remoteStream => {
    remoteVideo.srcObject = remoteStream;
    status("Live Teacher And Student Video Connected");
  });
  mediaCall.on("close", () => {
    remoteVideo.srcObject = null;
    status("Remote User Disconnected");
  });
}

function connectData(id){
  if(!peer) return;
  try{
    const connection = peer.connect(id, { reliable:true });
    dataConnection = connection;
    setupDataConnection(connection);
  }catch(error){
    console.error("Data connection error:", error);
  }
}

function setupDataConnection(connection){
  connection.on("open", () => {
    dataConnection = connection;
    status("Keyboard Sync Connected Successfully");
  });
  connection.on("data", data => {
    handleRemoteData(data);
  });
  connection.on("close", () => {
    dataConnection = null;
  });
}

function sendData(data){
  if(dataConnection && dataConnection.open){
    try{
      dataConnection.send(data);
    }catch(error){
      console.error("Data send error:", error);
    }
  }
}

function handleRemoteData(data){
  if(!data || !data.type) return;
  if(data.type==="keyDown"){
    const keys = document.querySelectorAll(`[data-note="${data.note}"]`);
    keys.forEach(key => pressRemoteKey(data.note, key));
  }
  if(data.type==="keyUp"){
    const keys = document.querySelectorAll(`[data-note="${data.note}"]`);
    keys.forEach(key => releaseRemoteKey(data.note, key));
  }
}

let remoteKeys = new Set();
let remoteSounds = {};

function pressRemoteKey(note, key){
  if(remoteKeys.has(note)) return;
  remoteKeys.add(note);
  key.classList.add("remote-active");
  playRemoteNote(note);
  updateDisplay();
}

function releaseRemoteKey(note, key){
  remoteKeys.delete(note);
  key.classList.remove("remote-active");
  stopRemoteNote(note);
  updateDisplay();
}

function playRemoteNote(note){
  initAudio();
  if(remoteSounds[note]) return;
  const osc = audioContext.createOscillator();
  const gain = audioContext.createGain();
  const filter = audioContext.createBiquadFilter();

  osc.type = "triangle";
  osc.frequency.value = frequency(note);
  filter.type = "lowpass";
  filter.frequency.value = 4500;

  gain.gain.setValueAtTime(0, audioContext.currentTime);
  gain.gain.linearRampToValueAtTime(.18, audioContext.currentTime+.02);
  gain.gain.linearRampToValueAtTime(.12, audioContext.currentTime+.15);

  osc.connect(filter);
  filter.connect(gain);
  gain.connect(audioContext.destination);
  osc.start();

  remoteSounds[note] = { osc, gain };
}

function stopRemoteNote(note){
  const sound = remoteSounds[note];
  if(!sound) return;
  const now = audioContext.currentTime;
  sound.gain.gain.cancelScheduledValues(now);
  sound.gain.gain.setValueAtTime(sound.gain.gain.value, now);
  sound.gain.gain.exponentialRampToValueAtTime(.0001, now+.2);
  try{
    sound.osc.stop(now+.25);
  }catch(e){}
  delete remoteSounds[note];
}

function updateRoleNames(){
  if(currentRole==="teacher"){
    document.getElementById("localName").textContent = "Teacher - My Camera";
    document.getElementById("remoteName").textContent = "Student - Remote Camera";
  }else{
    document.getElementById("localName").textContent = "Student - My Camera";
    document.getElementById("remoteName").textContent = "Teacher - Remote Camera";
  }
}

function toggleCamera(){
  if(!localStream) return;
  const track = localStream.getVideoTracks()[0];
  if(!track) return;
  cameraOn = !cameraOn;
  track.enabled = cameraOn;
  updateMediaButtons();
}

function toggleMic(){
  if(!localStream) return;
  const track = localStream.getAudioTracks()[0];
  if(!track) return;
  micOn = !micOn;
  track.enabled = micOn;
  updateMediaButtons();
}

function updateMediaButtons(){
  const cameraBtn = document.getElementById("cameraBtn");
  const micBtn = document.getElementById("micBtn");

  cameraBtn.textContent = cameraOn ? "Camera ON" : "Camera OFF";
  micBtn.textContent = micOn ? (currentRole==="teacher" ? "Teacher Mic ON" : "Student Mic ON") : (currentRole==="teacher" ? "Teacher Mic OFF" : "Student Mic OFF");

  cameraBtn.classList.toggle("active", cameraOn);
  micBtn.classList.toggle("active", micOn);
}

async function switchCamera(){
  if(!localStream) return;
  currentFacing = (currentFacing === "user") ? "environment" : "user";

  try{
    localStream.getTracks().forEach(t => t.stop());

    const newStream = await navigator.mediaDevices.getUserMedia({
      video:{ 
        facingMode:{ exact: currentFacing },
        width:{ ideal: 1280 },
        height:{ ideal: 720 }
      },
      audio:true
    });

    localStream = newStream;
    localVideo.srcObject = newStream;
    cameraOn = true;
    micOn = true;
    updateMediaButtons();

    if(mediaCall && mediaCall.peerConnection){
      const senders = mediaCall.peerConnection.getSenders();
      const newVideoTrack = newStream.getVideoTracks()[0];
      const newAudioTrack = newStream.getAudioTracks()[0];
      
      senders.forEach(sender => {
        if(sender.track && sender.track.kind === "video" && newVideoTrack){
          sender.replaceTrack(newVideoTrack);
        }
        if(sender.track && sender.track.kind === "audio" && newAudioTrack){
          sender.replaceTrack(newAudioTrack);
        }
      });
    }

    status(currentFacing === "user" ? "Front Camera Active" : "Back Camera Active");
  }catch(error){
    console.error("Exact facingMode failed, trying ideal:", error);
    try{
      const fallbackStream = await navigator.mediaDevices.getUserMedia({
        video:{ facingMode:{ ideal: currentFacing } },
        audio:true
      });
      localStream = fallbackStream;
      localVideo.srcObject = fallbackStream;
      status("Camera Switched Successfully");
    }catch(e){
      status("Camera Switching Not Supported On This Device");
      alert("Indha device-il camera switch seiyavillai.");
    }
  }
}

function openJitsiMeet() {
  const room = document.getElementById("roomId").value.trim();
  if(!room) {
    alert("முதலில் Room ID-ஐ உள்ளிடவும்!");
    return;
  }

  if(mediaCall) {
    try { mediaCall.close(); } catch(e) {}
    mediaCall = null;
  }
  
  if(peer) {
    try { peer.destroy(); } catch(e) {}
    peer = null;
  }

  if(localStream) {
    localStream.getTracks().forEach(track => {
      track.stop();
    });
    localStream = null;
  }

  if(localVideo) localVideo.srcObject = null;
  if(remoteVideo) remoteVideo.srcObject = null;

  cameraOn = false;
  micOn = false;
  updateMediaButtons();
  status("Switched to Jitsi Meet - Camera Released");

  const jitsiUrl = `https://meet.jit.si/AnikousMusicInstitute_${room}`;
  window.open(jitsiUrl, '_blank');
}

const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const BLACK_KEYS = [1,3,6,8,10];
let activeKeys = new Set();
let pointerMap = new Map();
let holdMode = false;
let showKeyNames = true;
let audioContext = null;
let sounds = {};
const piano = document.getElementById("piano");
const fsPiano = document.getElementById("fsPiano");

function initAudio(){
  if(!audioContext){
    const AC = window.AudioContext || window.webkitAudioContext;
    audioContext = new AC();
  }
  if(audioContext.state==="suspended"){
    audioContext.resume();
  }
}

function frequency(note){
  return 440 * Math.pow(2, (note-69)/12);
}

function playNote(note){
  initAudio();
  if(sounds[note]) return;
  const osc = audioContext.createOscillator();
  const gain = audioContext.createGain();
  const filter = audioContext.createBiquadFilter();

  osc.type = "triangle";
  osc.frequency.value = frequency(note);
  filter.type = "lowpass";
  filter.frequency.value = 4500;

  gain.gain.setValueAtTime(0, audioContext.currentTime);
  gain.gain.linearRampToValueAtTime(.3, audioContext.currentTime+.02);
  gain.gain.linearRampToValueAtTime(.20, audioContext.currentTime+.15);

  osc.connect(filter);
  filter.connect(gain);
  gain.connect(audioContext.destination);
  osc.start();

  sounds[note] = { osc, gain };
}

function stopNote(note){
  const sound = sounds[note];
  if(!sound) return;
  const now = audioContext.currentTime;
  sound.gain.gain.cancelScheduledValues(now);
  sound.gain.gain.setValueAtTime(sound.gain.gain.value, now);
  sound.gain.gain.exponentialRampToValueAtTime(.0001, now+.2);
  try{
    sound.osc.stop(now+.25);
  }catch(e){}
  delete sounds[note];
}

function noteName(note){
  const octave = Math.floor(note/12)-1;
  return NOTE_NAMES[note%12] + octave;
}

function pressKey(note, key){
  if(activeKeys.has(note)) return;
  activeKeys.add(note);
  
  const keys = document.querySelectorAll(`[data-note="${note}"]`);
  keys.forEach(k => k.classList.add("local-active"));

  playNote(note);
  sendData({ type:"keyDown", note:note });
  updateDisplay();
}

function releaseKey(note, key){
  if(holdMode) return;
  activeKeys.delete(note);
  
  const keys = document.querySelectorAll(`[data-note="${note}"]`);
  keys.forEach(k => k.classList.remove("local-active"));

  stopNote(note);
  sendData({ type:"keyUp", note:note });
  updateDisplay();
}

let selectedOctaves = new Set();

const totalWhiteKeys = 50;
let pianoScrollBox = document.getElementById("pianoScroll");
let availableWidth = pianoScrollBox ? pianoScrollBox.clientWidth - 24 : window.innerWidth - 40;
let currentKeyWidth = Math.max(12, Math.floor(availableWidth / totalWhiteKeys));

function zoomIn(){
  if(currentKeyWidth < 70){
    currentKeyWidth += 5;
    updateKeyZoom();
  }
}

function zoomOut(){
  let pianoScrollBox = document.getElementById("pianoScroll");
  let availableWidth = pianoScrollBox ? pianoScrollBox.clientWidth - 24 : window.innerWidth - 40;
  const minLimit = Math.max(10, Math.floor(availableWidth / totalWhiteKeys));
  if(currentKeyWidth > minLimit){
    currentKeyWidth -= 5;
    updateKeyZoom();
  }
}

function updateKeyZoom(){
  const root = document.documentElement;
  root.style.setProperty('--key-width', currentKeyWidth + 'px');
  root.style.setProperty('--key-height', (currentKeyWidth * 4.5) + 'px');
  root.style.setProperty('--black-width', (currentKeyWidth * 0.6) + 'px');
  root.style.setProperty('--black-height', (currentKeyWidth * 2.8) + 'px');
  createPiano();
  createFullscreenPiano();
}

function createOctaveButtons(){
  const box = document.getElementById("octaveButtons");
  box.innerHTML = "";
  for(let o=1; o<=7; o++){
    const btn = document.createElement("button");
    btn.textContent = "Oct "+o;
    btn.dataset.octave = o;
    if(selectedOctaves.has(o)){
      btn.classList.add("active");
    }
    
    btn.onclick = function(){
      const octaveNum = parseInt(this.dataset.octave);
      if(selectedOctaves.has(octaveNum)){
        selectedOctaves.delete(octaveNum);
        btn.classList.remove("active");
      } else {
        selectedOctaves.add(octaveNum);
        btn.classList.add("active");
      }
      createPiano();
      createFullscreenPiano();
    };
    box.appendChild(btn);
  }
}

function buildPianoDOM(containerTarget){
  containerTarget.innerHTML="";
  const start = 24; // C1
  const end = 108;  // C8
  let whiteIndex = 0;
  const whitePositions = {};

  for(let n=start; n<=end; n++){
    const pc = n%12;
    const octaveNum = Math.floor((n - 12) / 12);

    if(selectedOctaves.size > 0 && !selectedOctaves.has(octaveNum)){
      continue;
    }

    if(!BLACK_KEYS.includes(pc)){
      whitePositions[n] = whiteIndex;
      const key = document.createElement("div");
      key.className = "white";
      key.dataset.note = n;
      if(activeKeys.has(n)) key.classList.add("local-active");
      if(remoteKeys.has(n)) key.classList.add("remote-active");

      key.style.left = (whiteIndex * currentKeyWidth) + "px";
      key.innerHTML = `<span style="display: ${showKeyNames ? 'block' : 'none'};">${noteName(n)}</span>`;
      addKeyEvents(key, n);
      containerTarget.appendChild(key);
      whiteIndex++;
    }
  }

  for(let n=start; n<=end; n++){
    const pc = n%12;
    const octaveNum = Math.floor((n - 12) / 12);

    if(selectedOctaves.size > 0 && !selectedOctaves.has(octaveNum)){
      continue;
    }

    if(BLACK_KEYS.includes(pc)){
      let previous = n-1;
      while(previous>=start && BLACK_KEYS.includes(previous%12)){
        previous--;
      }
      const leftWhite = whitePositions[previous];
      if(leftWhite!==undefined){
        const key = document.createElement("div");
        key.className = "black";
        key.dataset.note = n;
        if(activeKeys.has(n)) key.classList.add("local-active");
        if(remoteKeys.has(n)) key.classList.add("remote-active");

        const blackWidth = currentKeyWidth * 0.6;
        key.style.left = (leftWhite * currentKeyWidth + (currentKeyWidth - blackWidth / 2) - (blackWidth / 2)) + "px";
        key.innerHTML = `<span style="display: ${showKeyNames ? 'block' : 'none'};">${noteName(n)}</span>`;
        addKeyEvents(key, n);
        containerTarget.appendChild(key);
      }
    }
  }
  containerTarget.style.width = (whiteIndex * currentKeyWidth) + "px";
}

function createPiano(){
  buildPianoDOM(piano);
  createOctaveButtons();
}

function createFullscreenPiano(){
  buildPianoDOM(fsPiano);
}

function togglePianoFullscreen(){
  const container = document.getElementById("pianoFullscreenContainer");
  container.classList.toggle("active");
  if(container.classList.contains("active")){
    createFullscreenPiano();
    if(screen.orientation && screen.orientation.lock){
      screen.orientation.lock("landscape").catch(() => {});
    }
  } else {
    if(screen.orientation && screen.orientation.unlock){
      screen.orientation.unlock();
    }
  }
}

function addKeyEvents(key, note){
  key.addEventListener("pointerdown", e => {
    e.preventDefault();
    key.setPointerCapture(e.pointerId);
    pointerMap.set(e.pointerId, note);
    pressKey(note, key);
  });

  key.addEventListener("pointerup", e => {
    e.preventDefault();
    pointerMap.delete(e.pointerId);
    releaseKey(note, key);
  });

  key.addEventListener("pointercancel", e => {
    pointerMap.delete(e.pointerId);
    releaseKey(note, key);
  });

  key.addEventListener("pointerleave", e => {
    if(!key.hasPointerCapture(e.pointerId)) return;
    if(!holdMode){
      pointerMap.delete(e.pointerId);
      releaseKey(note, key);
    }
  });
}

function centerPiano(){
  const box = document.getElementById("pianoScroll");
  box.scrollLeft = (box.scrollWidth - box.clientWidth)/2;
  const fsBox = document.getElementById("fsPianoScroll");
  fsBox.scrollLeft = (fsBox.scrollWidth - fsBox.clientWidth)/2;
}

function toggleHold(){
  holdMode = !holdMode;
  const btn = document.getElementById("holdBtn");
  const fsBtn = document.getElementById("fsHoldBtn");
  
  const btnText = holdMode ? "HOLD ON" : "HOLD OFF";
  if(btn) { btn.textContent = btnText; btn.classList.toggle("active", holdMode); }
  if(fsBtn) { fsBtn.textContent = holdMode ? "HOLD ON" : "HOLD"; fsBtn.classList.toggle("active", holdMode); }

  if(!holdMode){
    [...activeKeys].forEach(note=>{
      const keys = document.querySelectorAll(`[data-note="${note}"]`);
      keys.forEach(k => k.classList.remove("local-active"));
      stopNote(note);
      sendData({ type:"keyUp", note:note });
    });
    activeKeys.clear();
    pointerMap.clear();
    updateDisplay();
  }
}

function toggleKeyNames(){
  showKeyNames = !showKeyNames;
  const toggleBtn = document.getElementById("keyToggle");
  if(toggleBtn) toggleBtn.textContent = showKeyNames ? "Key Names ON" : "Key Names OFF";
  
  document.querySelectorAll(".white span,.black span").forEach(el=>{
    el.style.display = showKeyNames ? "block" : "none";
  });
}

function updateDisplay(){
  const local = [...activeKeys];
  const remote = [...remoteKeys];
  const all = [...new Set([...local, ...remote])].sort((a,b)=>a-b);

  const keyText = all.length ? all.map(noteName).join(" ") : "-";
  const chordText = all.length>=3 ? findChord(all) : "-";

  const keyShow = document.getElementById("keyShow");
  const chordShow = document.getElementById("chordShow");
  const fsChordDisplay = document.getElementById("fsChordDisplay");

  if(keyShow) keyShow.textContent = keyText;
  if(chordShow) chordShow.textContent = chordText;
  if(fsChordDisplay) fsChordDisplay.textContent = all.length ? `${keyText} (${chordText})` : "Anikous Piano Full View";
}

const CHORDS = {
  "0,4,7":"Major",
  "0,3,7":"Minor",
  "0,3,6":"Diminished",
  "0,4,8":"Augmented",
  "0,5,7":"Sus4",
  "0,2,7":"Sus2",
  "0,4,7,10":"7",
  "0,4,7,11":"Maj7",
  "0,3,7,10":"m7",
  "0,3,6,10":"m7b5",
  "0,3,6,9":"Dim7",
  "0,2,4,7":"Add9",
  "0,4,7,9":"6",
  "0,3,7,9":"m6"
};

function findChord(notes){
  const pcs = [...new Set(notes.map(n=>n%12))].sort((a,b)=>a-b);
  for(const root of pcs){
    const intervals = pcs.map(n=>(n-root+12)%12).sort((a,b)=>a-b);
    const key = intervals.join(",");
    if(CHORDS[key]){
      return NOTE_NAMES[root] + " " + CHORDS[key];
    }
  }
  return "-";
}

let midiAccess = null;
let midiConnected = false;
let midiInputs = [];

async function connectMIDI(){
  if(!navigator.requestMIDIAccess){
    status("Web MIDI Not Supported In This Browser");
    alert("இந்த browser Web MIDI support செய்யவில்லை.");
    return;
  }

  try{
    midiAccess = await navigator.requestMIDIAccess();
    midiInputs = [];
    midiAccess.inputs.forEach(input=>{
      midiInputs.push(input);
      input.onmidimessage = handleMIDI;
    });

    const count = midiInputs.length;
    if(count>0){
      midiConnected = true;
      status("MIDI Connected Successfully - " + count + " Device");
      alert("MIDI Connected Successfully");
    }else{
      midiConnected = false;
      status("MIDI Device Not Connected");
      alert("MIDI Device Not Connected");
    }

    midiAccess.onstatechange = event => {
      if(event.port.type==="input"){
        if(event.port.state==="connected"){
          event.port.onmidimessage = handleMIDI;
          midiConnected = true;
          status("MIDI Device Connected Successfully");
        }
        if(event.port.state==="disconnected"){
          status("MIDI Device Disconnected");
        }
      }
    };
  }catch(error){
    console.error(error);
    midiConnected = false;
    status("MIDI Permission Not Granted");
    alert("MIDI permission கிடைக்கவில்லை.");
  }
}

function handleMIDI(errorEvent){
  if(!errorEvent || !errorEvent.data) return;
  const data = errorEvent.data;
  if(data.length<2) return;

  const command = data[0] & 0xf0;
  const note = data[1];
  const velocity = data[2] || 0;

  if(command===0x90 && velocity>0){
    const keys = document.querySelectorAll(`[data-note="${note}"]`);
    keys.active = true;
    keys.forEach(key => pressKey(note, key));
    return;
  }

  if(command===0x80 || (command===0x90 && velocity===0)){
    const keys = document.querySelectorAll(`[data-note="${note}"]`);
    keys.forEach(key => releaseKey(note, key));
  }
}

updateKeyZoom();

document.addEventListener("pointerdown", () => {
  if(audioContext && audioContext.state==="suspended"){
    audioContext.resume();
  }
}, {once:true});

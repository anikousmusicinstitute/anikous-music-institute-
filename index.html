<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Anikous Music Institute</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1>Anikous Music Institute</h1>

<h2 id="welcomeText"></h2>

</header>

<main>

<div class="video-container">

<div class="video-box">

<h3>Your Camera</h3>

<video
id="localVideo"
autoplay
playsinline
muted>
</video>

</div>

<div class="video-box">

<h3>Live Class</h3>

<video
id="remoteVideo"
autoplay
playsinline>
</video>

</div>

</div>

<div class="controls">

<button id="micBtn">
🎤 Mic On
</button>

<button id="cameraBtn">
📷 Camera On
</button>

<button id="leaveBtn">
❌ Leave Class
</button>

<button id="logoutBtn">
🚪 Logout
</button>

</div>

</main>

<script>

const name = localStorage.getItem("name") || "User";
const role = localStorage.getItem("role") || "";

document.getElementById("welcomeText").innerHTML =
`Welcome <b>${name}</b> (${role})`;

</script>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Piano Studio Container (Add inside Studio Section or below video) -->
    <div id="piano-section" style="background: #181818; padding: 15px; border-radius: 8px; margin-top: 15px; text-align: center;">
        <div style="margin-bottom: 10px;">
            <label>Select Instrument: </label>
            <select id="instrument-select">
                <option value="acoustic_grand_piano">Acoustic Piano</option>
                <option value="electric_piano_1">Electric Piano</option>
                <option value="synth_bass">Synth Bass</option>
                <option value="violin">Violin</option>
                <option value="flute">Flute</option>
            </select>
        </div>
        <div id="piano-keyboard" style="display: flex; justify-content: center; overflow-x: auto; height: 120px; background: #000; padding: 10px; border-radius: 5px;">
            <!-- Piano Keys will be generated via JS -->
        </div>
    </div>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Music Teaching Platform</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. Firebase Login Section -->
    <div id="auth-section" class="container">
        <h2>Music Studio Login</h2>
        <button id="google-login-btn">Login with Google</button>
    </div>

    <!-- 2. Room Join Section -->
    <div id="room-section" class="container" style="display: none;">
        <h2>Welcome, <span id="user-name"></span></h2>
        <input type="text" id="room-input" placeholder="Enter Room ID">
        <button id="join-room-btn">Join Class</button>
    </div>

    <!-- 3. Video Call & Studio Section -->
    <div id="studio-section" style="display: none;">
        <div id="video-grid">
            <!-- Local & Remote Videos will appear here -->
            <div class="video-box">
                <video id="local-video" autoplay muted playsinline></video>
                <span class="user-label">You (Teacher/Student)</span>
            </div>
        </div>

        <div id="controls">
            <button id="mic-btn">Mute Mic</button>
            <button id="camera-btn">Stop Camera</button>
            <button id="screen-share-btn">Share Screen</button>
        </div>
    </div>

    <!-- Firebase Scripts (CDN) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    
    <!-- Socket.io -->
    <script src="http://localhost:3000/socket.io/socket.io.js"></script>

    <!-- Modular JS Files -->
    <script src="firebase.js"></script>
    <script src="video.js"></script>
    <script src="app.js"></script>
        <!-- 3. Video Call & Studio Section -->
    <div id="studio-section" style="display: none; display: flex; width: 95vw; height: 90vh; gap: 20px;">
        
        <!-- Left Side: Videos & Controls -->
        <div style="flex: 3; display: flex; flex-direction: column;">
            <div id="video-grid" style="flex: 1;">
                <div class="video-box">
                    <video id="local-video" autoplay muted playsinline></video>
                    <span id="local-user-label" class="user-label">You</span>
                </div>
            </div>

            <div id="controls">
                <button id="mic-btn">Mute Mic</button>
                <button id="camera-btn">Stop Camera</button>
                <button id="screen-share-btn">Share Screen</button>
                <button id="raise-hand-btn">✋ Raise Hand</button>
            </div>
        </div>

        <!-- Right Side: Live Class Tools (Chat & Student List) -->
        <div id="sidebar" style="flex: 1; background: #1e1e1e; padding: 15px; border-radius: 8px; display: flex; flex-direction: column; justify-content: space-between;">
            <div>
                <h3>Students List (<span id="student-count">0</span>)</h3>
                <ul id="student-list" style="list-style: none; padding: 0; max-height: 150px; overflow-y: auto;"></ul>
                <hr style="border-color: #333;">
            </div>

            <!-- Chat Box -->
            <div style="display: flex; flex-direction: column; height: 60%;">
                <h3>Live Chat</h3>
                <div id="chat-messages" style="flex: 1; background: #121212; padding: 10px; border-radius: 5px; overflow-y: auto; margin-bottom: 10px; font-size: 14px;"></div>
                <div style="display: flex; gap: 5px;">
                    <input type="text" id="chat-input" placeholder="Type a message..." style="flex: 1; margin: 0; padding: 8px;">
                    <button id="send-chat-btn" style="margin: 0; padding: 8px 12px;">Send</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Music Teaching Platform</title>
    <link rel="stylesheet" href="style.css">
    <!-- Tone.js for Audio/Piano -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- VexFlow for Sheet Music -->
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
</head>
<body>

    <!-- 1. Firebase Login Section -->
    <div id="auth-section" class="container">
        <h2>Music Studio Login</h2>
        <button id="google-login-btn">Login with Google</button>
    </div>

    <!-- 2. Room Join Section -->
    <div id="room-section" class="container" style="display: none;">
        <h2>Welcome, <span id="user-name"></span></h2>
        <input type="text" id="room-input" placeholder="Enter Room ID">
        <button id="join-room-btn">Join Class</button>
    </div>

    <!-- 3. Video Call & Studio Section -->
    <div id="studio-section" style="display: none;">
        <div class="main-studio-layout">
            <!-- Left Side: Videos & Controls -->
            <div class="left-panel">
                <div id="video-grid">
                    <div class="video-box">
                        <video id="local-video" autoplay muted playsinline></video>
                        <span id="local-user-label" class="user-label">You</span>
                    </div>
                </div>
                <div id="controls">
                    <button id="mic-btn">Mute Mic</button>
                    <button id="camera-btn">Stop Camera</button>
                    <button id="screen-share-btn">Share Screen</button>
                    <button id="raise-hand-btn">✋ Raise Hand</button>
                    <button id="record-btn">⏺ Start Recording</button>
                </div>
            </div>

            <!-- Right Side: Live Class Tools (Chat & Student List) -->
            <div id="sidebar" class="sidebar">
                <div>
                    <h3>Students List (<span id="student-count">0</span>)</h3>
                    <ul id="student-list"></ul>
                    <hr class="divider">
                </div>
                <div class="chat-container">
                    <h3>Live Chat</h3>
                    <div id="chat-messages"></div>
                    <div class="chat-input-row">
                        <input type="text" id="chat-input" placeholder="Type a message...">
                        <button id="send-chat-btn">Send</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Piano Section -->
        <div id="piano-section">
            <label>Select Instrument: </label>
            <select id="instrument-select">
                <option value="acoustic_grand_piano">Acoustic Piano</option>
                <option value="electric_piano_1">Electric Piano</option>
                <option value="synth_bass">Synth Bass</option>
            </select>
            <div id="piano-keyboard"></div>
        </div>

        <!-- Sheet Music Section -->
        <div id="sheet-music-section">
            <h3>Live Sheet Music</h3>
            <div id="output"></div>
            <div class="export-controls">
                <button id="export-pdf-btn">Export PDF</button>
                <button id="export-midi-btn">Export MIDI</button>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    
    <!-- Socket.io -->
    <script src="http://localhost:3000/socket.io/socket.io.js"></script>

    <!-- Modular JS Files -->
    <script src="firebase.js"></script>
    <script src="video.js"></script>
    <script src="chat.js"></script>
    <script src="piano.js"></script>
    <script src="notation.js"></script>
    <script src="app.js"></script>
</body>
</html>

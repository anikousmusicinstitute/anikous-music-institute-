<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Class Studio - Anikous Music Institute</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .class-container { max-width: 1200px; margin: 20px auto; padding: 20px; color: #fff; background: #0f172a; border-radius: 12px; }
        .video-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .video-box { background: #1e293b; border-radius: 8px; aspect-ratio: 16/9; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 1px solid #334155; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .video-label { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 4px 8px; font-size: 12px; border-radius: 4px; }
        #piano { display: flex; overflow-x: auto; background: #1e293b; padding: 15px; border-radius: 8px; border: 1px solid #334155; justify-content: center; }
        .key { flex-shrink: 0; border: 1px solid #0f172a; border-radius: 0 0 4px 4px; cursor: pointer; }
        .controls { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .btn-live { background: #6366f1; color: white; padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-live:hover { background: #4f46e5; }
    </style>
</head>
<body>

<header>
    <h1>🎵 Anikous Live Class</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="#" id="roomDisplay">Room: Loading...</a>
    </nav>
</header>

<div class="class-container">
    <div class="controls">
        <div>
            <h2>Studio Session</h2>
            <p style="color: #94a3b8; font-size: 14px;">WebRTC Video Call & Web MIDI Active Sync</p>
        </div>
        <button id="startCallBtn" class="btn-live">Start Video Stream</button>
    </div>

    <!-- Video Streams -->
    <div class="video-grid">
        <div class="video-box">
            <video id="localVideo" autoplay playsinline muted></video>
            <div class="video-label">You</div>
        </div>
        <div class="video-box">
            <video id="remoteVideo" autoplay playsinline></video>
            <div class="video-label">Remote Participant</div>
        </div>
    </div>

    <!-- 88-Key Piano Section -->
    <div>
        <div style="display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; color: #94a3b8;">
            <span>LIVE MIDI MASTER KEYBOARD (88 KEYS)</span>
            <span>Active Notes: <span id="activeCount" style="color: #818cf8; font-weight: bold;">0</span></span>
        </div>
        <div id="piano"></div>
    </div>
</div>

<script>
    // Room ID localStorage-la irundhu eduthu kaatrom
    const roomId = localStorage.getItem("currentRoomId") || "DefaultRoom";
    document.getElementById("roomDisplay").innerText = "Room ID: " + roomId;

    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const startCallBtn = document.getElementById('startCallBtn');
    const pianoContainer = document.getElementById('piano');
    const activeCount = document.getElementById('activeCount');

    let localStream;
    let peerConnection;
    const activeNotes = new Set();

    // WebSocket server connection (Render backend or localhost)
    const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${wsProtocol}//${window.location.hostname}:5000`);

    const servers = {
        iceServers: [{ urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }]
    };

    // 1. WebRTC Video Call Logic
    startCallBtn.onclick = async () => {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            localVideo.srcObject = localStream;
            
            createPeerConnection();
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            ws.send(JSON.stringify({ type: 'signal', room: roomId, sdp: peerConnection.localDescription }));
            
            startCallBtn.style.display = 'none';
        } catch (err) {
            console.error("Camera access error:", err);
            alert("Could not access camera/microphone.");
        }
    };

    function createPeerConnection() {
        peerConnection = new RTCPeerConnection(servers);

        peerConnection.onicecandidate = (event) => {
            if (event.candidate) {
                ws.send(JSON.stringify({ type: 'signal', room: roomId, candidate: event.candidate }));
            }
        };

        peerConnection.ontrack = (event) => {
            remoteVideo.srcObject = event.streams[0];
        };
    }

    // WebSocket Message Router (Signaling & MIDI notes syncing)
    ws.onmessage = async (event) => {
        const data = JSON.parse(event.data);

        // MIDI Note Event Sync
        if (data.type === 'midi') {
            if (data.action === 'on') activeNotes.add(data.note);
            else activeNotes.delete(data.note);
            updatePianoUI();
        }

        // WebRTC Signaling Event
        if (data.sdp) {
            if (!peerConnection) createPeerConnection();
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
            if (data.sdp.type === 'offer') {
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                ws.send(JSON.stringify({ type: 'signal', room: roomId, sdp: peerConnection.localDescription }));
            }
        } else if (data.candidate) {
            if (peerConnection) {
                await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        }
    };

    // 2. Web MIDI API (Hardware Keyboard Binding)
    if (navigator.requestMIDIAccess) {
        navigator.requestMIDIAccess().then(midiAccess => {
            for (let input of midiAccess.inputs.values()) {
                input.onmidimessage = (message) => {
                    const [command, note, velocity] = message.data;
                    const isNoteOn = command === 144 && velocity > 0;
                    const isNoteOff = command === 128 || (command === 144 && velocity === 0);

                    if (isNoteOn) {
                        activeNotes.add(note);
                        ws.send(JSON.stringify({ type: 'midi', room: roomId, note, action: 'on' }));
                    } else if (isNoteOff) {
                        activeNotes.delete(note);
                        ws.send(JSON.stringify({ type: 'midi', room: roomId, note, action: 'off' }));
                    }
                    updatePianoUI();
                };
            }
        }).catch(err => console.log("MIDI hardware not detected or allowed", err));
    }

    // 3. Generate 88-Key Piano UI
    function buildPiano() {
        pianoContainer.innerHTML = '';
        for (let midi = 21; midi <= 108; midi++) {
            const key = document.createElement('div');
            key.className = 'key';
            key.dataset.midi = midi;
            
            // Differentiating white and black keys layout
            const noteInOctave = (midi - 12) % 12;
            const isBlack = [1, 3, 6, 8, 10].includes(noteInOctave);

            if (isBlack) {
                key.style.width = '14px';
                key.style.height = '80px';
                key.style.backgroundColor = activeNotes.has(midi) ? '#818cf8' : '#020617';
                key.style.zIndex = '2';
                key.style.marginLeft = '-7px';
                key.style.marginRight = '-7px';
            } else {
                key.style.width = '22px';
                key.style.height = '130px';
                key.style.backgroundColor = activeNotes.has(midi) ? '#6366f1' : '#ffffff';
                key.style.zIndex = '1';
            }
            
            pianoContainer.appendChild(key);
        }
    }

    function updatePianoUI() {
        const keys = pianoContainer.querySelectorAll('.key');
        keys.forEach(key => {
            const midi = parseInt(key.dataset.midi);
            const noteInOctave = (midi - 12) % 12;
            const isBlack = [1, 3, 6, 8, 10].includes(noteInOctave);

            if (activeNotes.has(midi)) {
                key.style.backgroundColor = isBlack ? '#818cf8' : '#6366f1';
            } else {
                key.style.backgroundColor = isBlack ? '#020617' : '#ffffff';
            }
        });
        activeCount.innerText = activeNotes.size;
    }

    buildPiano();
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Teacher Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>👨‍🏫 Teacher Dashboard</h1>

<h2 id="teacherName"></h2>

<input
type="text"
id="roomId"
placeholder="Enter Class ID">

<!-- Changed button to trigger a JavaScript function instead of a static link -->
<button onclick="startClass()">
Start / Open Video Class
</button>

<script>
// Display teacher name from localStorage
document.getElementById("teacherName").innerText =
"Welcome " + (localStorage.getItem("name") || "Teacher");

function startClass() {
    const roomId = document.getElementById("roomId").value.trim();
    if (!roomId) {
        alert("Please enter a Class ID!");
        return;
    }
    
    // Room ID-a localStorage-la save panrom
    localStorage.setItem("currentRoomId", roomId);
    
    // Neraya munnadi create panna live.html page-ku redirect panrom
    window.location.href = "live.html";
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Class Studio - Socket.io</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .class-container { max-width: 1200px; margin: 20px auto; padding: 20px; color: #fff; background: #0f172a; border-radius: 12px; }
        .video-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .video-box { background: #1e293b; border-radius: 8px; aspect-ratio: 16/9; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 1px solid #334155; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .video-label { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 4px 8px; font-size: 12px; border-radius: 4px; }
        #piano { display: flex; overflow-x: auto; background: #1e293b; padding: 15px; border-radius: 8px; border: 1px solid #334155; justify-content: center; }
        .key { flex-shrink: 0; border: 1px solid #0f172a; border-radius: 0 0 4px 4px; }
        .controls { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .btn-live { background: #6366f1; color: white; padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
<div class="class-container">
    <div class="controls">
        <div>
            <h2>Studio Session - <span id="roomDisplay"></span></h2>
        </div>
        <button id="startCallBtn" class="btn-live">Start Video Stream</button>
    </div>
    <div class="video-grid">
        <div class="video-box"><video id="localVideo" autoplay playsinline muted></video><div class="video-label">You</div></div>
        <div class="video-box"><video id="remoteVideo" autoplay playsinline></video><div class="video-label">Remote Participant</div></div>
    </div>
    <div>
        <div style="display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; color: #94a3b8;">
            <span>LIVE MIDI MASTER KEYBOARD (88 KEYS)</span>
            <span>Active Notes: <span id="activeCount" style="color: #818cf8; font-weight: bold;">0</span></span>
        </div>
        <div id="piano"></div>
    </div>
</div>

<!-- Socket.io Client Script from CDN -->
<script src="/socket.io/socket.io.js"></script>
<script>
    const roomId = localStorage.getItem("currentRoomId") || "DefaultRoom";
    document.getElementById("roomDisplay").innerText = "Room: " + roomId;

    const socket = io();
    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const startCallBtn = document.getElementById('startCallBtn');
    const pianoContainer = document.getElementById('piano');
    const activeCount = document.getElementById('activeCount');

    let localStream, peerConnection;
    const activeNotes = new Set();

    const servers = { iceServers: [{ urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }] };

    // Join Room on load
    socket.emit("join-room", roomId);

    startCallBtn.onclick = async () => {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            localVideo.srcObject = localStream;
            startCallBtn.style.display = 'none';
        } catch (err) {
            console.error("Media error:", err);
        }
    };

    function createPeerConnection(remoteId) {
        peerConnection = new RTCPeerConnection(servers);

        if (localStream) {
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
        }

        peerConnection.onicecandidate = (event) => {
            if (event.candidate) {
                socket.emit("ice-candidate", { candidate: event.candidate, target: remoteId });
            }
        };

        peerConnection.ontrack = (event) => {
            remoteVideo.srcObject = event.streams[0];
        };
    }

    // WebRTC Signaling listeners via Socket.io
    socket.on("user-joined", async (id) => {
        createPeerConnection(id);
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        socket.emit("offer", { offer, target: id });
    });

    socket.on("offer", async (data) => {
        createPeerConnection(data.sender);
        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        socket.emit("answer", { answer, target: data.sender });
    });

    socket.on("answer", async (data) => {
        if (peerConnection) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
        }
    });

    socket.on("ice-candidate", async (data) => {
        if (peerConnection) {
            await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
        }
    });

    // MIDI Note Sync via Socket.io
    socket.on("midi-note", (data) => {
        if (data.action === 'on') activeNotes.add(data.note);
        else activeNotes.delete(data.note);
        updatePianoUI();
    });

    // Web MIDI API Hardware Binding
    if (navigator.requestMIDIAccess) {
        navigator.requestMIDIAccess().then(midiAccess => {
            for (let input of midiAccess.inputs.values()) {
                input.onmidimessage = (message) => {
                    const [command, note, velocity] = message.data;
                    const isNoteOn = command === 144 && velocity > 0;
                    const isNoteOff = command === 128 || (command === 144 && velocity === 0);
                    
                    if (isNoteOn) {
                        activeNotes.add(note);
                        socket.emit("midi-note", { note, action: 'on', room: roomId });
                    } else if (isNoteOff) {
                        activeNotes.delete(note);
                        socket.emit("midi-note", { note, action: 'off', room: roomId });
                    }
                    updatePianoUI();
                };
            }
        });
    }

    // Build 88-Key Piano UI
    function buildPiano() {
        pianoContainer.innerHTML = '';
        for (let midi = 21; midi <= 108; midi++) {
            const key = document.createElement('div');
            key.className = 'key';
            key.dataset.midi = midi;
            const noteInOctave = (midi - 12) % 12;
            const isBlack = [1, 3, 6, 8, 10].includes(noteInOctave);
            if (isBlack) {
                key.style.width = '14px'; key.style.height = '80px';
                key.style.backgroundColor = '#020617'; key.style.zIndex = '2';
                key.style.marginLeft = '-7px'; key.style.marginRight = '-7px';
            } else {
                key.style.width = '22px'; key.style.height = '130px';
                key.style.backgroundColor = '#ffffff'; key.style.zIndex = '1';
            }
            pianoContainer.appendChild(key);
        }
    }

    function updatePianoUI() {
        const keys = pianoContainer.querySelectorAll('.key');
        keys.forEach(key => {
            const midi = parseInt(key.dataset.midi);
            const isBlack = [1, 3, 6, 8, 10].includes((midi - 12) % 12);
            if (activeNotes.has(midi)) {
                key.style.backgroundColor = isBlack ? '#818cf8' : '#6366f1';
            } else {
                key.style.backgroundColor = isBlack ? '#020617' : '#ffffff';
            }
        });
        activeCount.innerText = activeNotes.size;
    }
    buildPiano();
</script>
</body>
</html>

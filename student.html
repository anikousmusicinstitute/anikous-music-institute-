<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Student Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🎓 Student Dashboard</h1>

<h2 id="studentName"></h2>

<input
type="text"
id="roomId"
placeholder="Enter Class ID">

<!-- Button with a click function instead of static anchor link -->
<button onclick="joinClass()">
Join Class
</button>

<script>
// Display student name from localStorage
document.getElementById("studentName").innerText =
"Welcome " + (localStorage.getItem("name") || "Student");

function joinClass() {
    const roomId = document.getElementById("roomId").value.trim();
    if (!roomId) {
        alert("Please enter a Class ID!");
        return;
    }
    
    // Room ID-a localStorage-la save panrom, appathan live class page-ku theriyum
    localStorage.setItem("currentRoomId", roomId);
    
    // Live Class page-ku redirect panrom (ungaloda live class html file name-a inge podunga, eg: live.html)
    window.location.href = "live.html"; 
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anikous Music Institute — Professional Studio</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <!-- VexFlow for Live Notation -->
  <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body>
  <div id="auth-container" class="auth-screen">
    <div class="auth-card">
      <h2>🎵 Anikous Music Institute</h2>
      <p>Next-Gen Online Music Education Platform</p>
      <input type="email" id="auth-email" placeholder="Email Address">
      <input type="password" id="auth-password" placeholder="Password">
      <div class="role-selector">
        <label><input type="radio" name="role" value="teacher" checked> Teacher</label>
        <label><input type="radio" name="role" value="student"> Student</label>
      </div>
      <button id="login-btn">Login / Register</button>
    </div>
  </div>

  <div id="studio-app" class="app-layout hidden">
    <!-- Top Navigation Bar -->
    <header class="studio-header">
      <div class="brand">🎹 Anikous Studio</div>
      <div class="class-meta">
        <span id="room-display">Room: #ANIKOUS-LIVE</span>
        <span id="class-timer">00:00:00</span>
      </div>
      <div class="header-controls">
        <button id="raise-hand-btn" class="icon-btn">✋ Raise Hand</button>
        <button id="record-btn" class="icon-btn">🔴 Record Session</button>
        <button id="logout-btn" class="danger-btn">Leave</button>
      </div>
    </header>

    <!-- Workspace Grid -->
    <div class="workspace">
      <!-- Left Panel: Video & Class Management -->
      <section class="video-section">
        <div id="video-grid" class="video-grid">
          <div class="video-box">
            <video id="local-video" autoplay muted playsinline></video>
            <span class="tag">You (Teacher)</span>
          </div>
        </div>
        <div class="video-toolbar">
          <button id="mic-toggle" class="control-btn active">🎤 Mic</button>
          <button id="cam-toggle" class="control-btn active">📹 Cam</button>
          <button id="screen-share" class="control-btn">🖥️ Share</button>
        </div>
      </section>

      <!-- Right Panel: Virtual Piano & Sheet Notation -->
      <section class="music-studio-section">
        <div class="notation-viewport">
          <div id="output-notation"></div>
        </div>
        <div class="piano-viewport">
          <div class="piano-controls">
            <select id="instrument-select">
              <option value="grand-piano">Grand Piano</option>
              <option value="electric-piano">Electric Piano</option>
              <option value="synth-lead">Synth Lead</option>
              <option value="acoustic-guitar">Acoustic Guitar</option>
            </select>
            <button id="toggle-labels" class="sub-btn">Toggle Key Labels</button>
            <button id="sustain-btn" class="sub-btn">Sustain: OFF</button>
          </div>
          <div id="virtual-piano" class="virtual-piano"></div>
        </div>
      </section>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="firebase.js"></script>
  <script src="video.js"></script>
  <script src="piano.js"></script>
  <script src="notation.js"></script>
  <script src="app.js"></script>
</body>
</html>
